# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/myRoomieServer?useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#server.port=8900

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
logging.level.org.hibernate.SQL=error

# Cloudinary Configuration
com.cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
com.cloudinary.api_key=${CLOUDINARY_API_KEY}
com.cloudinary.api_secret=${CLOUDINARY_API_SECRET}
com.cloudinary.bucket_name=${CLOUDINARY_BUCKET_NAME}

# Razorpay Configuration
# Test Configuration
#com.razorpaykey_id=${RAZORPAY_TEST_KEY_ID}
#com.razorpaysecretKey=${RAZORPAY_TEST_SECRET_KEY}

# Live Configuration
com.razorpaykey_id=${RAZORPAY_LIVE_KEY_ID}
com.razorpaysecretKey=${RAZORPAY_LIVE_SECRET_KEY}

# Google Maps API Key
com.googlemaps.ApiKey=${GOOGLE_MAPS_API_KEY}

# Email Configuration
email.from=${EMAIL_FROM}
email.host=${EMAIL_HOST}
email.port=${EMAIL_PORT}
email.username=${EMAIL_USERNAME}
email.password=${EMAIL_PASSWORD}
email.sentTo=${EMAIL_SENT_TO}
